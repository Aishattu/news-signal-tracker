<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="t d">
  <title id="t">How the News Signal Tracker works</title>
  <desc id="d">Every day, headlines from press wires are fetched, filtered so only real AI adopters stay, enriched with a verified decision maker and email through Clay, then posted to a Slack channel, taking turns between SDRs Sarah and John.</desc>
  <style>
    .bg { fill: #F4F6F9; }
    .node { fill: #FFFFFF; stroke: #D3DAE3; stroke-width: 1.2; }
    .drop-node { fill: #FFFFFF; stroke: #D3DAE3; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .eyebrow { font: 600 10.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: .08em; }
    .title { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #15212B; }
    .sub { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #5B6B7A; }
    .h1 { font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #15212B; }
    .label { font: 500 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #5B6B7A; }
    .mono { font: 400 11.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #15212B; }
    .brand { font: 800 17px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #15212B; letter-spacing: .01em; }
    .news { fill: #1F5FA8; } .py { fill: #2F6F8F; } .claude { fill: #B85A37; } .clay { fill: #2E7D57; } .slack { fill: #611F69; } .muted { fill: #8A96A3; }
    .go-line { stroke: #2F7D8C; stroke-width: 2; fill: none; stroke-dasharray: 6 5; animation: march 0.9s linear infinite; }
    .drop-line { stroke: #A3ADB8; stroke-width: 2; fill: none; stroke-dasharray: 3 5; animation: march 1.6s linear infinite; }
    .pill-text { font: 700 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .sarah-on { fill: #3B5BDB; animation: sarah 4s steps(1) infinite; }
    .john-on { fill: #B5338A; animation: john 4s steps(1) infinite; }
    .sarah-t { fill: #3B5BDB; animation: sarahT 4s steps(1) infinite; }
    .john-t { fill: #B5338A; animation: johnT 4s steps(1) infinite; }
    @keyframes march { to { stroke-dashoffset: -22; } }
    @keyframes sarah { 0% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes john { 0% { opacity: 0; } 50% { opacity: 1; } }
    @keyframes sarahT { 0% { fill: #FFFFFF; } 50% { fill: #3B5BDB; } }
    @keyframes johnT { 0% { fill: #B5338A; } 50% { fill: #FFFFFF; } }
    @media (prefers-reduced-motion: reduce) { .go-line, .drop-line, .sarah-on, .john-on, .sarah-t, .john-t { animation: none; } .dot { display: none; } }
  </style>
  <defs>
    <marker id="aGo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F7D8C"/></marker>
    <marker id="aDrop" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#A3ADB8"/></marker>
    <path id="dailyArc" d="M890,142 C890,100 872,90 830,90 L170,90 C128,90 110,100 110,142"/>
    <path id="mainPath" d="M192,190 L806,190"/>
    <path id="routePath" d="M890,238 L890,318"/>
  </defs>

  <rect class="bg" x="0" y="0" width="1000" height="560" rx="16"/>
  <text class="h1" x="30" y="46">How the News Signal Tracker works</text>

  <!-- daily loop -->
  <use href="#dailyArc" class="go-line" marker-end="url(#aGo)"/>
  <text class="label" x="500" y="80" text-anchor="middle">Runs every day · the rotation picks up where it left off</text>
  <circle class="dot" r="5" fill="#2F7D8C"><animateMotion dur="4.2s" repeatCount="indefinite"><mpath href="#dailyArc"/></animateMotion></circle>

  <!-- main path connectors -->
  <line class="go-line" x1="192" y1="190" x2="221" y2="190" marker-end="url(#aGo)"/>
  <line class="go-line" x1="387" y1="190" x2="416" y2="190" marker-end="url(#aGo)"/>
  <line class="go-line" x1="582" y1="190" x2="611" y2="190" marker-end="url(#aGo)"/>
  <line class="go-line" x1="777" y1="190" x2="806" y2="190" marker-end="url(#aGo)"/>

  <!-- row 1 -->
  <g>
    <rect class="node" x="30" y="142" width="160" height="96" rx="10"/>
    <text class="eyebrow news" x="46" y="166">NEWS WIRES</text>
    <text class="title" x="46" y="190">Headlines in</text>
    <text class="sub" x="46" y="210">PR Newswire, Business</text>
    <text class="sub" x="46" y="225">Wire, GlobeNewswire</text>
  </g>
  <g>
    <rect class="node" x="225" y="142" width="160" height="96" rx="10"/>
    <text class="eyebrow py" x="241" y="166">fetch_news.py</text>
    <text class="title" x="241" y="190">Fetch</text>
    <text class="sub" x="241" y="210">Last 14 days, searched</text>
    <text class="sub" x="241" y="225">with adoption phrases</text>
  </g>
  <g>
    <rect class="node" x="420" y="142" width="160" height="96" rx="10"/>
    <text class="eyebrow claude" x="436" y="166">CLAUDE</text>
    <text class="title" x="436" y="190">Real signal?</text>
    <text class="sub" x="436" y="210">Keeps companies that</text>
    <text class="sub" x="436" y="225">adopt AI, not vendors</text>
  </g>
  <g>
    <rect class="node" x="615" y="142" width="160" height="96" rx="10"/>
    <text class="eyebrow clay" x="631" y="166">email_waterfall.sh</text>
    <text class="title" x="631" y="190">Enrich</text>
    <text class="sub" x="631" y="210">Decision maker, LinkedIn,</text>
    <text class="sub" x="631" y="225">verified email via Clay</text>
  </g>
  <g>
    <rect class="node" x="810" y="142" width="160" height="96" rx="10"/>
    <text class="eyebrow py" x="826" y="166">route_leads.py</text>
    <text class="title" x="826" y="190">Round robin</text>
    <text class="sub" x="826" y="210">Each lead goes to the</text>
    <text class="sub" x="826" y="225">next SDR in line</text>
  </g>

  <!-- dropped -->
  <line class="drop-line" x1="500" y1="238" x2="500" y2="318" marker-end="url(#aDrop)"/>
  <text class="label" x="512" y="283">Not a signal?</text>
  <g>
    <rect class="drop-node" x="420" y="322" width="160" height="80" rx="10"/>
    <text class="eyebrow muted" x="436" y="346">DROPPED</text>
    <text class="sub" x="436" y="368">Vendor launches, funding,</text>
    <text class="sub" x="436" y="383">surveys, event promos</text>
  </g>

  <!-- routed to slack -->
  <use href="#routePath" class="go-line" marker-end="url(#aGo)"/>
  <circle class="dot" r="5" fill="#2F7D8C"><animateMotion dur="1.6s" repeatCount="indefinite"><mpath href="#routePath"/></animateMotion></circle>
  <g>
    <rect class="node" x="740" y="322" width="230" height="130" rx="10"/>
    <text class="eyebrow slack" x="756" y="346">SLACK</text>
    <text class="title" x="756" y="370">New lead posted</text>
    <text class="sub" x="756" y="390">#ai-adoption-news-signal</text>
    <rect x="756" y="406" width="94" height="30" rx="15" fill="#E2E8FC"/>
    <rect class="sarah-on" x="756" y="406" width="94" height="30" rx="15"/>
    <text class="pill-text sarah-t" x="803" y="425" text-anchor="middle">Sarah</text>
    <rect x="860" y="406" width="94" height="30" rx="15" fill="#F6E0EE"/>
    <rect class="john-on" x="860" y="406" width="94" height="30" rx="15"/>
    <text class="pill-text john-t" x="907" y="425" text-anchor="middle">John</text>
  </g>
  <line x1="855" y1="452" x2="855" y2="474" stroke="#A3ADB8" stroke-width="1.5"/>
  <rect x="770" y="474" width="170" height="28" rx="6" fill="#FFFFFF" stroke="#D3DAE3"/>
  <text class="mono" x="855" y="492" text-anchor="middle">round_robin.json</text>

  <!-- what each post has -->
  <text class="label" x="726" y="346" text-anchor="end">Each post has:</text>
  <text class="sub" x="726" y="366" text-anchor="end">name and title</text>
  <text class="sub" x="726" y="382" text-anchor="end">verified email</text>
  <text class="sub" x="726" y="398" text-anchor="end">LinkedIn</text>
  <text class="sub" x="726" y="414" text-anchor="end">news headline + link</text>

  <!-- legend -->
  <line class="go-line" x1="30" y1="346" x2="70" y2="346" style="animation:none"/>
  <text class="label" x="84" y="350">Lead moves on</text>
  <line class="drop-line" x1="30" y1="376" x2="70" y2="376" style="animation:none"/>
  <text class="label" x="84" y="380">Dropped, not an AI adopter</text>
  <text class="label" x="30" y="412">Only contacts confirmed to work</text>
  <text class="label" x="30" y="428">there today are delivered</text>

  <!-- footer -->
  <line x1="30" y1="520" x2="970" y2="520" stroke="#D3DAE3"/>
  <text class="label" x="30" y="545">Python · Claude · Clay · Slack webhook</text>
  <text class="brand" x="970" y="546" text-anchor="end">Aishastreamlines</text>
</svg>
